name: OCI-Noah CI and GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_single_rc:
        description: 'Publish single-container RC image for isolated verification only'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oci-noah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Run backend tests
        run: python -m pytest -q backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/rc.js
          node --check frontend/ui2.js
          node --check frontend/ui-lint.mjs

      - name: Validate UI consistency
        run: node frontend/ui-lint.mjs

      - name: Test backend release preflight
        run: |
          python -m unittest discover -s tests -p 'test_backend_release_preflight.py' -v

      - name: Test verified release snapshots
        run: python -m unittest discover -s tests -p 'test_verified_release_backup.py' -v

      - name: Test durable maintenance marker foundation
        run: python -m unittest discover -s tests -p 'test_durable_maintenance.py' -v

      - name: Test atomic maintenance admission protocol
        run: python -m unittest discover -s tests -p 'test_atomic_admission.py' -v

      - name: Test repository durable maintenance admission
        run: python -m unittest discover -s tests -p 'test_repository_durable_admission.py' -v

      - name: Test HTTP OCI maintenance route guard
        run: python -m unittest discover -s tests -p 'test_maintenance_route_guard.py' -v

      - name: Test durable scheduler release-maintenance pause
        run: python -m unittest discover -s tests -p 'test_durable_scheduler_maintenance.py' -v

      - name: Test release drain readiness report
        run: python -m unittest discover -s tests -p 'test_release_drain_check.py' -v

      - name: Test OCI HTTP in-flight tracker
        run: python -m unittest discover -s tests -p 'test_oci_http_inflight.py' -v

      - name: Test runtime drain snapshot coverage
        run: python -m unittest discover -s tests -p 'test_runtime_drain_snapshot.py' -v

      - name: Test authenticated release drain diagnostic
        run: python -m unittest discover -s tests -p 'test_runtime_drain_endpoint.py' -v

      - name: Audit release maintenance route protection
        run: python -m unittest discover -s tests -p 'test_release_guard_coverage.py' -v

      - name: Test backend release evidence report
        run: python -m unittest discover -s tests -p 'test_backend_release_evidence.py' -v

      - name: Test staged backend candidate image inspection
        run: python -m unittest discover -s tests -p 'test_backend_candidate_check.py' -v

      - name: Test unified backend release preflight
        run: python -m unittest discover -s tests -p 'test_backend_release_unified_preflight.py' -v

      - name: Test backend process topology audit
        run: python -m unittest discover -s tests -p 'test_backend_process_topology.py' -v

      - name: Test backend release coordinator plan
        run: python -m unittest discover -s tests -p 'test_backend_release_plan.py' -v

      - name: Test cross-process OCI maintenance leases
        run: python -m unittest discover -s tests -p 'test_oci_operation_leases.py' -v

      - name: Test atomic maintenance task drain
        run: |
          python -m unittest discover -s tests -p 'test_atomic_maintenance_task_drain.py' -v
          python -m unittest discover -s tests -p 'test_durable_maintenance.py' -v
          python -m unittest discover -s tests -p 'test_oci_operation_leases.py' -v

      - name: Test durable OCI background task leases
        run: python -m unittest discover -s tests -p 'test_oci_background_leases.py' -v

      - name: Test persisted OCI lease diagnostics
        run: python -m unittest discover -s tests -p 'test_oci_lease_diagnostics.py' -v

      - name: Test OCI lease record validation
        run: python -m unittest discover -s tests -p 'test_oci_lease_record_validation.py' -v

      - name: Test maintenance exit drain barrier
        run: python -m unittest discover -s tests -p 'test_maintenance_exit_guard.py' -v

      - name: Test maintenance entry lease validation
        run: python -m unittest discover -s tests -p 'test_maintenance_entry_lease_validation.py' -v

      - name: Test backend release safety boundaries
        run: python -m unittest discover -s tests -p 'test_backend_preflight_safety_boundary.py' -v

      - name: Test isolated candidate schema safety
        run: python -m unittest discover -s tests -p 'test_isolated_candidate_schema.py' -v

      - name: Test disposable release snapshot restore
        run: python -m unittest discover -s tests -p 'test_disposable_restore_drill.py' -v

      - name: Test fail-closed backend release planning
        run: python -m unittest discover -s tests -p 'test_backend_controlled_release.py' -v

      - name: Test standard Compose image separation
        run: python -m unittest discover -s tests -p 'test_compose_standard_update.py' -v

      - name: Validate guarded one-shot backend release
        run: |
          bash -n deploy/release-one-shot.sh
          python -m unittest discover -s tests -p 'test_release_one_shot.py' -v

      - name: Check experimental single-container contracts
        run: |
          python -m unittest discover -s tests -p 'test_single_container_contract.py' -v
          python -m compileall -q deploy/single
          cp .env.example .env
          docker compose -f deploy/compose.single.yml config --quiet

      - name: Verify external Unix Guard experimental isolation contracts
        run: |
          python -m unittest discover -s tests -p 'test_single_external_guard.py' -v
          python -m unittest discover -s tests -p 'test_single_external_guard_transport.py' -v
          DOCKER_GID=997 docker compose -f deploy/compose.external-guard-lab.yml config --quiet

      - name: Validate explicitly gated paired RC image publication
        run: python -m unittest discover -s tests -p 'test_single_rc_pair_publish.py' -v

      - name: Test immutable external Guard RC manifest admission
        run: python -m unittest discover -s tests -p 'test_single_external_guard_release_manifest.py' -v

      - name: Verify published RC pair in isolated review-only Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_single_rc_pinned_pair.py' -v
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/data" "$tmp/logs"
          cp .env.example "$tmp/candidate.env"
          export DOCKER_GID=997
          export OCI_NT_RC_ENV_FILE="$tmp/candidate.env"
          export OCI_NT_RC_DATA_DIR="$tmp/data"
          export OCI_NT_RC_LOG_DIR="$tmp/logs"
          docker compose -f deploy/compose.external-guard-rc.review.yml config --format json |
            python deploy/single/validate-external-guard-rc.py

      - name: Build experimental single-container image (no push)
        run: docker build -f deploy/single/Dockerfile -t oci-nt-single:ci .

      - name: Verify disposable lifecycle test boundaries
        run: python -m pytest -q tests/test_single_lifecycle_contract.py

      - name: Single-container migration gate regression
        run: python -m unittest discover -s tests -p 'test_single_migration_gate.py' -v

      - name: Test offline single-container cutover and rollback data copies
        run: python -m unittest discover -s tests -p 'test_single_offline_cutover.py' -v

      - name: Verify dedicated experimental Docker guard process identity
        run: python -m unittest discover -s tests -p 'test_single_socket_identity.py' -v

      - name: Audit single-container cross-process release evidence gates
        run: python -m unittest discover -s tests -p 'test_single_readiness_audit.py' -v

      - name: Disposable single-container runtime smoke and fail-fast test
        run: bash deploy/single/ci-smoke.sh

      - name: Disposable external Guard / all-in-one real Docker integration
        run: bash deploy/single/ci-external-guard.sh

      - name: Verify integrated switch test isolation contracts
        run: python -m unittest discover -s tests -p 'test_single_integrated_acceptance.py' -v

      - name: Test fail-closed production single-container cutover controller
        run: python -m unittest discover -s tests -p 'test_single_release_controller.py' -v

      - name: Test rollback evidence
        run: python -m unittest discover -s tests -p 'test_single_rollback_evidence.py' -v

      - name: Audit background OCI admission coverage
        run: python -m unittest discover -s tests -p 'test_single_admission_audit.py' -v

      - name: Verify immutable rollback image gate contracts
        run: python -m unittest discover -s tests -p 'test_single_rollback_image_gate.py' -v

      - name: Test pinned rollback Compose override renderer
        run: python -m unittest discover -s tests -p 'test_single_rollback_override.py' -v

      - name: Validate pinned four-service rollback Compose contract
        run: python -m unittest discover -s tests -p 'test_single_validate_four_rollback.py' -v

      - name: Verify production cutover sequence stays unarmed
        run: python -m unittest discover -s tests -p 'test_single_cutover_sequence.py' -v

      - name: Test explicit atomic maintenance operator
        run: python -m unittest discover -s tests -p 'test_single_maintenance_operator.py' -v

      - name: Test atomic maintenance and task admission
        run: python -m unittest discover -s tests -p 'test_single_atomic_admission.py' -v

      - name: Integrate durable OCI leases with release maintenance
        run: python -m unittest discover -s tests -p 'test_single_lease_maintenance_integration.py' -v

      - name: Test OCI schedule preservation on release maintenance race
        run: python -m unittest discover -s tests -p 'test_single_scheduler_maintenance_race.py' -v

      - name: Exercise OCI shutdown drain with live asyncio tasks
        run: python -m unittest discover -s tests -p 'test_single_worker_drain_runtime.py' -v

      - name: Simulate transactional cutover and fail-closed recovery
        run: python -m unittest discover -s tests -p 'test_single_cutover_transaction.py' -v

      - name: Verify Docker container ownership and independent-project isolation
        run: python -m unittest discover -s tests -p 'test_single_docker_scope_adapter.py' -v

      - name: Verify blocking OCI thread retains lease across task cancellation
        run: python -m unittest discover -s tests -p 'test_single_oci_thread_lease_boundary.py' -v

      - name: Exercise OCI worker lease real asyncio cancellation lifecycle
        run: PYTHONPATH=backend python -m unittest discover -s tests -p 'test_single_oci_worker_lease_lifecycle.py' -v

      - name: Verify scheduled OCI checks register durable background leases
        run: python -m unittest discover -s tests -p 'test_single_oci_scheduler_admission_chain.py' -v

      - name: Audit direct OCI SDK service call routes for durable HTTP leases
        run: python -m unittest discover -s tests -p 'test_single_oci_direct_sdk_route_audit.py' -v

      - name: Check OCI-facing route declarations against durable HTTP lease admission
        run: python -m unittest discover -s tests -p 'test_single_oci_entrypoint_route_coverage.py' -v

      - name: Verify OCI HTTP and background worker lease boundaries remain fail-closed
        run: python -m unittest discover -s tests -p 'test_single_oci_global_drain_contract.py' -v

      - name: Verify production inventory audit remains observational only
        run: python -m unittest discover -s tests -p 'test_single_production_readonly_audit.py' -v

      - name: Verify consolidated production preflight stays read-only
        run: python -m unittest discover -s tests -p 'test_single_production_preflight.py' -v

      - name: Test OCI read and write release admission
        run: python -m unittest discover -s tests -p 'test_single_oci_read_admission.py' -v

      - name: Test durable OCI lease during task cancellation
        run: python -m unittest discover -s tests -p 'test_single_worker_cancel_lease.py' -v

      - name: Test fail-closed cutover rollback fault matrix
        run: python -m unittest discover -s tests -p 'test_single_cutover_recovery_matrix.py' -v

      - name: Verify candidate mode disables scheduled OCI checks
        run: python -m unittest discover -s tests -p 'test_single_candidate_scheduler_disabled.py' -v

      - name: Reject unproven running OCI generation
        run: python -m unittest discover -s tests -p 'test_single_running_runtime_gate.py' -v

      - name: Check detached OCI worker cancellation and drain visibility
        run: python -m unittest discover -s tests -p 'test_single_detached_worker_drain.py' -v

      - name: Verify offline SQLite backup integrity and fail-closed handling
        run: python -m unittest discover -s tests -p 'test_single_offline_backup_drill.py' -v

      - name: Validate cutover backup verification and rollback ordering
        run: python -m unittest discover -s tests -p 'test_single_cutover_backup_order.py' -v

      - name: Validate OCI quiescence evidence fail-closed contract
        run: python -m unittest discover -s tests -p 'test_single_quiescence_evidence.py' -v

      - name: Validate consolidated single-container RC safety blockers
        run: python -m unittest discover -s tests -p 'test_single_rc_readiness.py' -v

      - name: Disposable four-to-single-to-four container and SQLite drill
        run: bash deploy/single/ci-four-single-four.sh

      - name: Exercise pinned external Guard RC to legacy four-container rollback
        run: bash deploy/single/ci-external-guard-rollback.sh

      - name: Verify isolated real Docker lifecycle and container identity
        run: python deploy/single/ci-docker-lifecycle.py

      - name: Exercise cutover coordinator with disposable Docker and fault injection
        env:
          OCI_NT_CI_COORDINATOR: disposable-only
        run: python deploy/single/ci-cutover-coordinator.py

      - name: Validate Docker Compose
        env:
          OCI_NOAH_IMAGE_TAG: ci
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Validate safe Web release procedure
        env:
          OCI_NOAH_BACKEND_TAG: ci
          OCI_NOAH_WEB_TAG: ci-web
          OCI_NT_RELEASE_WEB_IMAGE: ghcr.io/noahting55/oci-noah-web:sha-0000000000000000000000000000000000000000
        run: |
          bash -n deploy/release-web.sh
          docker compose -f docker-compose.yml -f deploy/compose.web-release.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.web-release.yml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert s["web"]["image"].endswith("sha-" + "0"*40); assert s["api"]["image"].endswith(":ci"); assert s["monitor"]["image"].endswith(":ci"); assert s["docker-guard"]["image"].endswith(":ci")'

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/noahting55/oci-noah-api
          - name: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/noahting55/oci-noah-web
          - name: single
            context: .
            dockerfile: ./deploy/single/Dockerfile
            image: ghcr.io/noahting55/oci-noah-single

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_single_rc:
    name: Publish isolated single-container RC
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release/2.0-single-container-rc' &&
      inputs.publish_single_rc == true &&
      github.repository == 'NoahTing55/OCI-Noah'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact RC commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable RC reference
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release/2.0-single-container-rc" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact RC single image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/single/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/noahting55/oci-noah-single:sha-${{ github.sha }}
          provenance: true
          sbom: true

      - name: Build and publish exact RC Guard image
        id: guard_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/single/Dockerfile.guard
          push: true
          platforms: linux/amd64
          tags: ghcr.io/noahting55/oci-noah-guard:sha-${{ github.sha }}
          provenance: true
          sbom: true

      - name: Report immutable digest and prohibited production actions
        env:
          RC_DIGEST: ${{ steps.build.outputs.digest }}
          GUARD_DIGEST: ${{ steps.guard_build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GUARD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Single-container RC artifact (isolated testing only)"
            echo ""
            echo 'Tag: `ghcr.io/noahting55/oci-noah-single:sha-${{ github.sha }}`'
            echo "Digest: `$RC_DIGEST`"
            echo ""
            echo "External read-only Docker Guard RC artifact (isolated testing only)"
            echo ""
            echo 'Tag: `ghcr.io/noahting55/oci-noah-guard:sha-${{ github.sha }}`'
            echo "Digest: `$GUARD_DIGEST`"
            echo ""
            echo "No production pull, restart, Compose or cutover performed."
          } >> "$GITHUB_STEP_SUMMARY"
