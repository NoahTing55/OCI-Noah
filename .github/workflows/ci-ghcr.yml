name: OCI-Noah CI and GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-noah-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test source
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Run backend tests
        run: python -m pytest -q backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/rc.js
          node --check frontend/ui2.js
          node --check frontend/ui-lint.mjs

      - name: Validate UI consistency
        run: node frontend/ui-lint.mjs

      - name: Test backend release preflight
        run: |
          python -m unittest discover -s tests -p 'test_backend_release_preflight.py' -v

      - name: Test verified release snapshots
        run: python -m unittest discover -s tests -p 'test_verified_release_backup.py' -v

      - name: Test durable maintenance marker foundation
        run: python -m unittest discover -s tests -p 'test_durable_maintenance.py' -v

      - name: Test atomic maintenance admission protocol
        run: python -m unittest discover -s tests -p 'test_atomic_admission.py' -v

      - name: Test repository durable maintenance admission
        run: python -m unittest discover -s tests -p 'test_repository_durable_admission.py' -v

      - name: Test HTTP OCI maintenance route guard
        run: python -m unittest discover -s tests -p 'test_maintenance_route_guard.py' -v

      - name: Test durable scheduler release-maintenance pause
        run: python -m unittest discover -s tests -p 'test_durable_scheduler_maintenance.py' -v

      - name: Test release drain readiness report
        run: python -m unittest discover -s tests -p 'test_release_drain_check.py' -v

      - name: Test OCI HTTP in-flight tracker
        run: python -m unittest discover -s tests -p 'test_oci_http_inflight.py' -v

      - name: Test runtime drain snapshot coverage
        run: python -m unittest discover -s tests -p 'test_runtime_drain_snapshot.py' -v

      - name: Test authenticated release drain diagnostic
        run: python -m unittest discover -s tests -p 'test_runtime_drain_endpoint.py' -v

      - name: Audit release maintenance route protection
        run: python -m unittest discover -s tests -p 'test_release_guard_coverage.py' -v

      - name: Test backend release evidence report
        run: python -m unittest discover -s tests -p 'test_backend_release_evidence.py' -v

      - name: Test staged backend candidate image inspection
        run: python -m unittest discover -s tests -p 'test_backend_candidate_check.py' -v

      - name: Test unified backend release preflight
        run: python -m unittest discover -s tests -p 'test_backend_release_unified_preflight.py' -v

      - name: Test backend process topology audit
        run: python -m unittest discover -s tests -p 'test_backend_process_topology.py' -v

      - name: Test backend release coordinator plan
        run: python -m unittest discover -s tests -p 'test_backend_release_plan.py' -v

      - name: Test cross-process OCI maintenance leases
        run: python -m unittest discover -s tests -p 'test_oci_operation_leases.py' -v

      - name: Test atomic maintenance task drain
        run: |
          python -m unittest discover -s tests -p 'test_atomic_maintenance_task_drain.py' -v
          python -m unittest discover -s tests -p 'test_durable_maintenance.py' -v
          python -m unittest discover -s tests -p 'test_oci_operation_leases.py' -v

      - name: Test durable OCI background task leases
        run: python -m unittest discover -s tests -p 'test_oci_background_leases.py' -v

      - name: Test persisted OCI lease diagnostics
        run: python -m unittest discover -s tests -p 'test_oci_lease_diagnostics.py' -v

      - name: Test OCI lease record validation
        run: python -m unittest discover -s tests -p 'test_oci_lease_record_validation.py' -v

      - name: Test maintenance exit drain barrier
        run: python -m unittest discover -s tests -p 'test_maintenance_exit_guard.py' -v

      - name: Test maintenance entry lease validation
        run: python -m unittest discover -s tests -p 'test_maintenance_entry_lease_validation.py' -v

      - name: Test backend release safety boundaries
        run: python -m unittest discover -s tests -p 'test_backend_preflight_safety_boundary.py' -v

      - name: Test isolated candidate schema safety
        run: python -m unittest discover -s tests -p 'test_isolated_candidate_schema.py' -v

      - name: Test disposable release snapshot restore
        run: python -m unittest discover -s tests -p 'test_disposable_restore_drill.py' -v

      - name: Test fail-closed backend release planning
        run: python -m unittest discover -s tests -p 'test_backend_controlled_release.py' -v

      - name: Test standard Compose image separation
        run: python -m unittest discover -s tests -p 'test_compose_standard_update.py' -v

      - name: Validate guarded one-shot backend release
        run: |
          bash -n deploy/release-one-shot.sh
          python -m unittest discover -s tests -p 'test_release_one_shot.py' -v

      - name: Check experimental single-container contracts
        run: |
          python -m unittest discover -s tests -p 'test_single_container_contract.py' -v
          python -m compileall -q deploy/single
          cp .env.example .env
          docker compose -f deploy/compose.single.yml config --quiet

      - name: Build experimental single-container image (no push)
        run: docker build -f deploy/single/Dockerfile -t oci-nt-single:ci .

      - name: Verify disposable lifecycle test boundaries
        run: python -m pytest -q tests/test_single_lifecycle_contract.py

      - name: Single-container migration gate regression
        run: python -m unittest discover -s tests -p 'test_single_migration_gate.py' -v

      - name: Test offline single-container cutover and rollback data copies
        run: python -m unittest discover -s tests -p 'test_single_offline_cutover.py' -v

      - name: Verify dedicated experimental Docker guard process identity
        run: python -m unittest discover -s tests -p 'test_single_socket_identity.py' -v

      - name: Disposable single-container runtime smoke and fail-fast test
        run: bash deploy/single/ci-smoke.sh

      - name: Validate Docker Compose
        env:
          OCI_NOAH_IMAGE_TAG: ci
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Validate safe Web release procedure
        env:
          OCI_NOAH_BACKEND_TAG: ci
          OCI_NOAH_WEB_TAG: ci-web
          OCI_NT_RELEASE_WEB_IMAGE: ghcr.io/noahting55/oci-noah-web:sha-0000000000000000000000000000000000000000
        run: |
          bash -n deploy/release-web.sh
          docker compose -f docker-compose.yml -f deploy/compose.web-release.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.web-release.yml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert s["web"]["image"].endswith("sha-" + "0"*40); assert s["api"]["image"].endswith(":ci"); assert s["monitor"]["image"].endswith(":ci"); assert s["docker-guard"]["image"].endswith(":ci")'

  publish:
    name: Publish ${{ matrix.name }} image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            image: ghcr.io/noahting55/oci-noah-api
          - name: web
            context: ./frontend
            image: ghcr.io/noahting55/oci-noah-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
