<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OCI-N&amp;T VNC</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=rednt-1">
  <link rel="alternate icon" href="/favicon.ico?v=rednt-1">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=rednt-1">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111827;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    #screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #bar{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(17,24,39,.82);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
    #bar strong{margin-right:auto}.status{font-size:13px;color:#cbd5e1}.error{color:#fca5a5}
    button{border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:#374151;color:#fff}button:hover{background:#4b5563}
    canvas{max-width:100%;max-height:100%}
  </style>
</head>
<body>
  <div id="bar"><strong>N&amp;T VNC</strong><span id="status" class="status">正在连接……</span><button id="fullscreen" type="button">全屏</button><button id="disconnect" type="button">断开</button></div>
  <div id="screen"></div>
  <script type="module">
    const statusBox = document.getElementById('status');
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      statusBox.textContent = '缺少 VNC 会话 Token';
      statusBox.classList.add('error');
      throw new Error('missing token');
    }
    const moduleUrl = 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.7.0/core/rfb.js';
    let RFB;
    try {
      ({ default: RFB } = await import(moduleUrl));
    } catch (error) {
      statusBox.textContent = 'noVNC 组件加载失败，请检查浏览器网络';
      statusBox.classList.add('error');
      throw error;
    }
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = `${scheme}://${location.host}/api/v1/vnc/ws/${encodeURIComponent(token)}`;
    const rfb = new RFB(document.getElementById('screen'), wsUrl, { wsProtocols: ['binary'] });
    rfb.scaleViewport = true;
    rfb.resizeSession = false;
    rfb.background = '#111827';
    rfb.addEventListener('connect', () => { statusBox.textContent = '已连接'; statusBox.classList.remove('error'); });
    rfb.addEventListener('disconnect', (event) => {
      statusBox.textContent = event.detail.clean ? '连接已断开' : '连接异常断开';
      if (!event.detail.clean) statusBox.classList.add('error');
    });
    rfb.addEventListener('credentialsrequired', () => {
      const password = prompt('VNC 密码（OCI 控制台通常不需要）') || '';
      rfb.sendCredentials({ password });
    });
    document.getElementById('disconnect').addEventListener('click', () => rfb.disconnect());
    document.getElementById('fullscreen').addEventListener('click', () => document.documentElement.requestFullscreen?.());
  </script>
</body>
</html>
